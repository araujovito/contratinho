[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar-pncp"
version = "0.1.0"
description = "Radar de licitações abertas do PNCP: filtra editais por perfil e avisa só o que é novo."
readme = "README.md"
# O pypncp exige 3.12+; não dá para descer sem largar a biblioteca.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vitor Araújo" }]
keywords = ["pncp", "licitacao", "governo", "compras publicas", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "pypncp>=1.2.1",
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-django>=4.9", "ruff>=0.5"]
web = ["Django>=5.2,<5.3", "dj-database-url>=2.3,<4", "psycopg[binary]>=3.2,<4"]

[project.scripts]
radar = "radar_pncp.cli:app"

[project.urls]
Homepage = "https://github.com/araujovito/radar-pncp"
Issues = "https://github.com/araujovito/radar-pncp/issues"

[tool.hatch.build.targets.wheel]
packages = ["radar_pncp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "radar_pncp.web.settings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
